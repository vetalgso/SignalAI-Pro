services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: signalai
      POSTGRES_PASSWORD: signalai
      POSTGRES_DB: signalai
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalai -d signalai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ["backend/.env"]
    environment:
      DATABASE_URL: postgresql+psycopg2://signalai:signalai@db:5432/signalai
      REDIS_URL: redis://redis:6379/0
      APP_VERSION: 2.0.0-rc.1
      SCHEDULER_BACKGROUND_LOOP_ENABLED: "${SCHEDULER_BACKGROUND_LOOP_ENABLED:-true}"
      SCHEDULER_BACKGROUND_POLL_SECONDS: "${SCHEDULER_BACKGROUND_POLL_SECONDS:-5}"
      SCHEDULER_DISTRIBUTED_LOCK_ENABLED: "${SCHEDULER_DISTRIBUTED_LOCK_ENABLED:-true}"
      SCHEDULER_ADVISORY_LOCK_KEY: "${SCHEDULER_ADVISORY_LOCK_KEY:-2026080320}"
      SIGNAL_TRACKING_ENABLED: "${SIGNAL_TRACKING_ENABLED:-true}"
      SIGNAL_TRACKING_INTERVAL_SECONDS: "${SIGNAL_TRACKING_INTERVAL_SECONDS:-60}"
      TESTNET_ORDER_EXECUTION_ENABLED: "${TESTNET_ORDER_EXECUTION_ENABLED:-true}"
      TESTNET_MAX_ORDER_NOTIONAL: "${TESTNET_MAX_ORDER_NOTIONAL:-100}"
      TESTNET_ALLOWED_SYMBOLS: "${TESTNET_ALLOWED_SYMBOLS:-}"
      ENABLE_BINANCE_EXECUTION: "${ENABLE_BINANCE_EXECUTION:-false}"
      BINANCE_TESTNET: "${BINANCE_TESTNET:-true}"
      ENABLE_REAL_TRADING: "${ENABLE_REAL_TRADING:-false}"
      BINANCE_TESTNET_API_KEY: "${BINANCE_TESTNET_API_KEY:-}"
      BINANCE_TESTNET_SECRET_KEY: "${BINANCE_TESTNET_SECRET_KEY:-}"
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.32.1
    profiles:
      - monitoring
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/templates:/etc/alertmanager/templates:ro
      - ./monitoring/alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    restart: unless-stopped


  e2e-runner:
    image: python:3.12-slim
    profiles:
      - monitoring
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      SIGNALAI_E2E_PROMETHEUS_URL: "http://prometheus:9090"
      SIGNALAI_E2E_ALERTMANAGER_URL: "http://alertmanager:9093"
      SIGNALAI_E2E_RUNTIME_RULE_FILE: "/rules/e2e-self-test.runtime.yml"
      SIGNALAI_E2E_LOCK_FILE: "/data/e2e-self-test.lock"
      E2E_RUNNER_STARTUP_DELAY_SECONDS: "${E2E_RUNNER_STARTUP_DELAY_SECONDS:-300}"
      E2E_RUNNER_INTERVAL_SECONDS: "${E2E_RUNNER_INTERVAL_SECONDS:-86400}"
      E2E_RUNNER_RETRY_DELAY_SECONDS: "${E2E_RUNNER_RETRY_DELAY_SECONDS:-900}"
      E2E_RUNNER_SELF_TEST_TIMEOUT_SECONDS: "${E2E_RUNNER_SELF_TEST_TIMEOUT_SECONDS:-90}"
      E2E_RUNNER_PROCESS_TIMEOUT_SECONDS: "${E2E_RUNNER_PROCESS_TIMEOUT_SECONDS:-600}"
      E2E_RUNNER_HISTORY_LIMIT: "${E2E_RUNNER_HISTORY_LIMIT:-20}"
    command:
      - python
      - /opt/signalai/e2e_runner.py
      - --self-test
      - /opt/signalai/e2e_self_test.py
      - --report-file
      - /data/latest.json
      - --history-file
      - /data/history.json
      - --state-file
      - /data/runner-state.json
    volumes:
      - ./monitoring/e2e_runner.py:/opt/signalai/e2e_runner.py:ro
      - ./monitoring/e2e_self_test.py:/opt/signalai/e2e_self_test.py:ro
      - ./monitoring/e2e-reports:/data
      - ./monitoring/prometheus/rules:/rules
    depends_on:
      prometheus:
        condition: service_started
      alertmanager:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json;
          from pathlib import Path;
          data=json.loads(Path('/data/runner-state.json').read_text());
          assert data['runner_status'] in
          {'WAITING','RUNNING','COMPLETED'}
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  e2e-exporter:
    image: python:3.12-slim
    profiles:
      - monitoring
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      - python
      - /opt/signalai/e2e_exporter.py
      - --host
      - 0.0.0.0
      - --port
      - "9102"
      - --report-file
      - /data/latest.json
      - --history-file
      - /data/history.json
      - --state-file
      - /data/runner-state.json
    volumes:
      - ./monitoring/e2e_exporter.py:/opt/signalai/e2e_exporter.py:ro
      - ./monitoring/e2e-reports:/data:ro
    ports:
      - "${E2E_EXPORTER_PORT:-9102}:9102"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.1
    profiles:
      - monitoring
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_started
      alertmanager:
        condition: service_started
      e2e-exporter:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.1
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-signalai-local}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/signalai-scheduler-operations.json
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: signalai-telegram
  group_by:
    - alertname
    - severity
    - component
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: signalai-telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        chat_id_file: /etc/alertmanager/secrets/telegram_chat_id
        send_resolved: true
        parse_mode: ""
        message: '{{ template "telegram.signalai.message" . }}'

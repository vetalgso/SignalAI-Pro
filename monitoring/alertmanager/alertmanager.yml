global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: signalai-telegram-info
  group_by:
    - alertname
    - component
    - instance
  group_wait: 2m
  group_interval: 30m
  repeat_interval: 12h

  routes:
    - receiver: signalai-telegram-critical
      matchers:
        - 'severity="critical"'
      group_wait: 5s
      group_interval: 2m
      repeat_interval: 1h

    - receiver: signalai-telegram-warning
      matchers:
        - 'severity="warning"'
      group_wait: 30s
      group_interval: 10m
      repeat_interval: 4h

    - receiver: signalai-telegram-info
      matchers:
        - 'severity="info"'
      group_wait: 2m
      group_interval: 30m
      repeat_interval: 12h

receivers:
  - name: signalai-telegram-critical
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        chat_id_file: /etc/alertmanager/secrets/telegram_chat_id
        send_resolved: true
        parse_mode: ""
        message: '{{ template "telegram.signalai.message" . }}'

  - name: signalai-telegram-warning
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        chat_id_file: /etc/alertmanager/secrets/telegram_chat_id
        send_resolved: true
        parse_mode: ""
        message: '{{ template "telegram.signalai.message" . }}'

  - name: signalai-telegram-info
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        chat_id_file: /etc/alertmanager/secrets/telegram_chat_id
        send_resolved: true
        parse_mode: ""
        message: '{{ template "telegram.signalai.message" . }}'

inhibit_rules:
  - source_matchers:
      - 'alertname="SignalAISchedulerMetricsTargetDown"'
    target_matchers:
      - 'component="scheduler"'
      - 'severity=~"warning|info"'
    equal:
      - job
      - instance

  - source_matchers:
      - 'alertname="SignalAISchedulerNotReady"'
    target_matchers:
      - 'alertname=~"SignalAISchedulerBackgroundLoopStopping|SignalAISchedulerConsecutiveFailures"'
    equal:
      - component
      - job
      - instance

  - source_matchers:
      - 'alertname=~"SignalAISchedulerLatestCycleFailed|SignalAISchedulerNewFailedCycle"'
    target_matchers:
      - 'alertname="SignalAISchedulerConsecutiveFailures"'
    equal:
      - component
      - job
      - instance

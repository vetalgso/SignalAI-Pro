global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090


  - job_name: signalai-alertmanager
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          service: signalai-alertmanager
          component: alerting

  - job_name: signalai-scheduler
    metrics_path: /api/v3/scheduler/metrics
    scrape_interval: 5s
    static_configs:
      - targets:
          - api:8000
        labels:
          service: signalai-api
          component: scheduler

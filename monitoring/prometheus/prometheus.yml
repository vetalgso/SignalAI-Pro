global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090


  - job_name: signalai-alertmanager
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          service: signalai-alertmanager
          component: alerting


  - job_name: signalai-e2e
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets:
          - e2e-exporter:9102
        labels:
          service: signalai-e2e-exporter
          component: monitoring-e2e

  - job_name: signalai-scheduler
    metrics_path: /api/v3/scheduler/metrics
    scrape_interval: 5s
    static_configs:
      - targets:
          - api:8000
        labels:
          service: signalai-api
          component: scheduler


  - job_name: signalai-order-reconciliation
    metrics_path: /api/v3/orders/reconciliation/metrics
    scrape_interval: 5s
    static_configs:
      - targets:
          - api:8000
        labels:
          service: signalai-api
          component: order-reconciliation


  - job_name: signalai-signal-pipeline
    metrics_path: /api/v3/signals/runtime/metrics
    scrape_interval: 5s
    static_configs:
      - targets:
          - api:8000
        labels:
          service: signalai-api
          component: signal-pipeline

  alert_rule_test:
  - eval_time: 6m
    alertname: SignalAISignalLifecycleMissing
    exp_alerts: []
  - eval_time: 6m
    alertname: SignalAISignalLifecycleStale
    exp_alerts: []
  - eval_time: 6m

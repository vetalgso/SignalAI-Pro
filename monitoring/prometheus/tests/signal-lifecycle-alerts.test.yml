    values: 1+0x12
  - series: signalai_signal_lifecycle_seconds_since_last_completion{job="signalai-signal-pipeline",instance="api:8000"}
    values: 1000+0x12
  - series: signalai_signal_lifecycle_latest_duration_seconds{job="signalai-signal-pipeline",instance="api:8000"}
    values: 1000+0x12
  - series: signalai_signal_lifecycle_latest_errors{job="signalai-signal-pipeline",instance="api:8000"}
    values: 2+0x12
  alert_rule_test:
  - eval_time: 6m
    alertname: SignalAISignalLifecycleMissing
